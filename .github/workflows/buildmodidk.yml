name: Build Quest Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nndung129/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download QPM CLI
      run: |
        wget -q https://github.com
        tar -xzf qpm-linux-x64.tar.gz
        chmod +x qpm
        sudo mv qpm /usr/local/bin/

    - name: Compile and Package Mod
      run: |
        qpm qmod build
