name: Build Quest Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Android NDK Directly from Google
      run: |
        wget -q https://google.com
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Download QPM CLI
      run: |
        wget -q https://github.com
        tar -xzf qpm-linux-x64.tar.gz
        chmod +x qpm
        sudo mv qpm /usr/local/bin/

    - name: Compile and Package Mod
      run: |
        qpm qmod build
